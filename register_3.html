<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Registration - Step 3/3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container step3-container">
        <div class="portal-header">
            <h2>Account Verification (Step 3/3)</h2>
            <p>Final security checks & course selection</p>
        </div>

        <form onsubmit="completeRegistration(event)">
            <div class="form-group">
                <label for="course">Program Applied For</label>
                <select id="course" required>
                    <option value="" disabled selected>Select a Program</option>
                    <option value="B.Tech CS">B.Tech Computer Science</option>
                    <option value="B.Tech ME">B.Tech Mechanical</option>
                    <option value="Bio.Tech">Bio.Tech</option>
                    <option value="BCA">BCA</option>
                     <option value="Bsc.AI">Bsc.AI</option>
                    <option value="Bsc.CS">Bsc.CS</option>
                    <option value="Bsc.DS">Bsc.DS</option>
                </select>
            </div>

            <div class="form-group verification-card">
                <label for="email">Student Email Address</label>
                <input type="email" id="email" required placeholder="Used for portal login">
                <button type="button" class="btn btn-verify" id="btn-email-verify" onclick="sendOTP('email')">Verify Email via OTP</button>
                <span id="emailSuccess" class="success-text">✔ Email Verified Successfully!</span>
                
                <div id="email-otp-section" class="otp-section">
                    <label for="emailOTP">Enter 6-Digit Email OTP</label>
                    <input type="text" id="emailOTP" placeholder="Enter OTP">
                    <button type="button" class="btn btn-verify" onclick="verifyOTP('email')">Submit Email OTP</button>
                </div>
            </div>

            <div class="form-group verification-card">
                <label for="phone">Student Mobile Number</label>
                <input type="text" id="phone" pattern="\d{10}" required placeholder="10-digit number">
                <button type="button" class="btn btn-verify" id="btn-phone-verify" onclick="sendOTP('phone')">Verify Phone via SMS</button>
                <span id="phoneSuccess" class="success-text">✔ Phone Verified Successfully!</span>
                
                <div id="phone-otp-section" class="otp-section">
                    <label for="phoneOTP">Enter 6-Digit SMS OTP</label>
                    <input type="text" id="phoneOTP" placeholder="Enter OTP">
                    <button type="button" class="btn btn-verify" onclick="verifyOTP('phone')">Submit Phone OTP</button>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Create Password</label>
                <input type="password" id="password" required minlength="8" placeholder="Minimum 8 characters">
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required placeholder="Re-enter password">
            </div>

            <div class="form-group captcha-block">
                <label for="captcha">Anti-Bot Verification</label>
                <div class="captcha-container">
                    <canvas id="captcha-canvas" width="180" height="50" onclick="generateCaptcha()"></canvas>
                    <button type="button" class="refresh-btn" onclick="generateCaptcha()" title="Refresh CAPTCHA">↻</button>
                </div>
                <input type="text" id="captcha" required placeholder="Enter CAPTCHA exactly as shown">
            </div>

            <div id="error-msg" class="error"></div>
            
            <div class="btn-group">
                <button type="button" class="btn btn-secondary" onclick="navigateTo('register_2.html', event)">← Go Back</button>
                <button type="submit" class="btn btn-accent">Complete Registration</button>
            </div>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
