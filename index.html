<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container login-container">
        <div class="portal-header">
            <h2>Student Login Portal</h2>
            <p>Access your academic dashboard</p>
        </div>
        
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Registered Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="form-group captcha-block">
                <label for="captcha">Security Verification</label>
                <div class="captcha-container">
                    <canvas id="captcha-canvas" width="180" height="50" onclick="generateCaptcha()"></canvas>
                    <button type="button" class="refresh-btn" onclick="generateCaptcha()" title="Refresh CAPTCHA">↻</button>
                </div>
                <input type="text" id="captcha" required placeholder="Enter CAPTCHA (Case Sensitive)">
            </div>

            <div id="error-msg" class="error"></div>

            <button type="submit" class="btn btn-primary">Secure Login</button>
            <a href="register_1.html" class="link">New student? Register Here</a>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
