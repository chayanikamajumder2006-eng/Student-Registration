<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>
    <div class="background-shape shape-three"></div>

    <div class="container login-container">

        <div class="logo">🎓</div>

        <h1>Student Login Portal</h1>

        <p class="subtitle">
            Sign in to access your student account
        </p>

        <form id="loginForm" onsubmit="handleLogin(event)">

            <div class="form-group">
                <label for="email">Registered Email Address</label>

                <div class="input-container">
                    <span class="input-icon">✉</span>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="input-container">
                    <span class="input-icon">🔒</span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword()"
                        aria-label="Show or hide password"
                    >
                        👁
                    </button>
                </div>
            </div>

            <div class="login-options">
                <label class="remember-option">
                    <input type="checkbox" id="remember">
                    <span>Remember me</span>
                </label>

                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <div class="form-group captcha-section">

                <label for="captcha">Security Verification</label>

                <div class="captcha-container">

                    <canvas
                        id="captcha-canvas"
                        width="190"
                        height="55"
                        title="Click to generate a new CAPTCHA"
                        onclick="generateCaptcha()"
                    ></canvas>

                    <button
                        type="button"
                        class="refresh-btn"
                        onclick="generateCaptcha()"
                        title="Refresh CAPTCHA"
                    >
                        ↻
                    </button>

                </div>

                <div class="input-container captcha-input">
                    <span class="input-icon">✓</span>

                    <input
                        type="text"
                        id="captcha"
                        placeholder="Enter the security code"
                        autocomplete="off"
                        required
                    >
                </div>

                <small class="captcha-note">
                    The security code is case-sensitive.
                </small>

            </div>

            <div id="error-msg" class="message error-message"></div>
            <div id="success-msg" class="message success-message"></div>

            <button type="submit" class="btn">
                <span>Secure Login</span>
                <span class="arrow">→</span>
            </button>

            <div class="divider">
                <span>New student?</span>
            </div>

            <a href="register_1.html" class="register-link">
                Create a New Account
            </a>

        </form>

        <p class="footer-text">
            🔐 Your account information is safe and protected.
        </p>

    </div>

    <script src="app.js"></script>

</body>
</html>
